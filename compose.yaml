name: claude-world
services:
  # ================================================================
  # CLAUDE WORLD:Single-container cloud dev terminal
  # ================================================================
  dev:
    image: lscr.io/linuxserver/baseimage-ubuntu:noble
    container_name: claude-world
    restart: unless-stopped
    privileged: true  # needed for Docker-in-Docker (internal dockerd runs nested containers)
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Rome
      CUSTOM_USER: abc
      PASSWORD: CHANGE_ME_WEB_PASSWORD
      SUDO_PASSWORD: CHANGE_ME_SUDO_PASSWORD
      TMUX_AUTO: "0"
      TMUX_TIMEOUT: "-1"
      # --- Agent Selector ---
      # Which coding agent to install and auto-launch.
      # Options: claude | codex | cline
      AGENT: claude
      # --- Generic BYOK (Bring Your Own Key) ---
      # Fill once and init.sh maps it to the selected agent.
      # Per-agent keys below take precedence if set.
      AGENT_API_KEY: ""
      AGENT_MODEL: ""
      # Generic base URL override (Claude Code only; unsupported by Codex).
      AGENT_BASE_URL: ""
      # --- Claude Code ---
      # Leave empty to use Anthropic directly. Set to https://api.deepseek.com/anthropic
      # or https://openrouter.ai/api/anthropic to use a third-party provider.
      ANTHROPIC_BASE_URL: ""
      ANTHROPIC_AUTH_TOKEN: CHANGE_ME_ANTHROPIC_KEY
      ANTHROPIC_MODEL: claude-opus-4-8
      ANTHROPIC_DEFAULT_OPUS_MODEL: claude-opus-4-8
      ANTHROPIC_DEFAULT_SONNET_MODEL: claude-sonnet-4-6
      ANTHROPIC_DEFAULT_HAIKU_MODEL: claude-haiku-4-5
      CLAUDE_CODE_SUBAGENT_MODEL: claude-haiku-4-5
      CLAUDE_CODE_EFFORT_LEVEL: max
      # --- OpenAI Codex ---
      # Optional: falls back to AGENT_API_KEY / AGENT_MODEL if empty.
      OPENAI_API_KEY: ""
      CODEX_MODEL: ""
      # Version pin (defaults to known-good 0.160.1; set to 'latest' to opt out of pinning)
      CODEX_VERSION: ""
      # --- Cline ---
      # Headless BYOK: init.sh pre-seeds ~/.cline/data/settings/providers.json
      # on every boot (merge — existing providers preserved).
      # Primary provider (active by default on boot):
      # CLINE_API_KEY falls back to AGENT_API_KEY; also exported under the
      # provider's standard env name (see CLINE_PROVIDER) as convenience.
      CLINE_API_KEY: ""
      CLINE_PROVIDER: anthropic
      CLINE_MODEL: ""
      # Additional providers & models (optional):
      # Add numbered providers to configure multiple backends simultaneously:
      # CLINE_PROVIDER_2: openai
      # CLINE_API_KEY_2: ""
      # CLINE_MODEL_2: gpt-4o
      # CLINE_PROVIDER_3: openrouter
      # CLINE_API_KEY_3: ""
      # CLINE_MODEL_3: deepseek/deepseek-r1
      # --- Cline Telegram Connector ---
      # Chat with your agent from Telegram. Set the bot token (from @BotFather)
      # to enable it: init.sh starts the hub + connector on every boot, and the
      # registration persists in /config (survives rebuilds).
      # STRONGLY recommended: set CLINE_TELEGRAM_ALLOWED_USER_ID (your numeric
      # Telegram id from @userinfobot) or anyone who finds the bot can run tasks.
      CLINE_TELEGRAM_TOKEN: ""
      CLINE_TELEGRAM_ALLOWED_USER_ID: ""
      # Optional bot username override (auto-detected from the token if empty).
      CLINE_TELEGRAM_BOT_USERNAME: ""
      # Working directory for Telegram sessions, and whether tools are enabled.
      CLINE_TELEGRAM_CWD: /workplace
      CLINE_TELEGRAM_TOOLS: "on"
      GIT_USER_NAME: CHANGE_ME_GIT_NAME
      GIT_USER_EMAIL: CHANGE_ME_GIT_EMAIL
      GITHUB_TOKEN: CHANGE_ME_GITHUB_TOKEN
      # --- Webhook Notifications ---
      # Set to a webhook URL (e.g. https://hooks.slack.com/...) to receive
      # a POST when the agent finishes responding and no one is connected.
      AGENT_WEBHOOK_URL: ""
      # Seconds of terminal silence before the agent is considered idle (min 60).
      AGENT_WEBHOOK_IDLE: "60"
    ports:
      - "7681:7681"
      - "2222:22"
    volumes:
      - ./config:/config
      - ./workplace:/workplace
      - ./init.sh:/etc/cont-init.d/99-claude-world.sh:ro

  # NOTE: No docker.sock mount — the dev container runs its own
  # isolated Docker daemon (DinD). It cannot see or touch host containers.

  # ================================================================
  # BESZEL AGENT:Sends system metrics to your Beszel hub
  # ================================================================
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: claude-world-beszel-agent
    restart: unless-stopped
    network_mode: host
    environment:
      LISTEN: "45002"
      KEY: CHANGE_ME_BESZEL_KEY
      EXTRA_FILESYSTEMS: /dev/sda1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
